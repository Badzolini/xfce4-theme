# Peppermint OS 9 look - izvučeno sa originalne instalacije (lxsession desktop.conf + xfconf)

# GTK tema: Peppermint-<Boja>-<Varijanta>
#   Boje: Red Blue Green Grey Orange Pink Purple
#   Varijante: Dark Light Mix
DEFAULT_COLOR="Red-Dark"
XFWM_THEME="Peppermint-xfwm4"

# Original je Pepirus-Dark (Peppermint fork Papirusa). Ako nije u profiles/peppermint/icons,
# koristi se Papirus-Dark iz repozitorijuma.
ICON_THEME="Pepirus-Dark"
ICON_FALLBACK="Papirus-Dark"

CURSOR_THEME="DMZ-White"
CURSOR_SIZE=18
FONT="Ubuntu 11"
FONT_FALLBACK="Noto Sans 10"
TITLE_FONT="Ubuntu Bold 10"

# Paketi potrebni za ovaj profil (Debian/Ubuntu imena)
PACKAGES="xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin xfce4-xkb-plugin papirus-icon-theme dmz-cursor-theme gtk2-engines-murrine gtk2-engines-pixbuf"
